# EXAMPLE ONLY. Copy values into the ignored secrets.toml; never commit secrets.
# Keep Gemini entries above [auth] so they remain top-level TOML values.
GEMINI_API_KEY = ""
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Single-provider native Streamlit OIDC. Register this exact callback with your
# provider. Use your HTTPS application URL for a public deployment.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "" # Generate a private random value of at least 32 bytes.
client_id = ""
client_secret = ""
server_metadata_url = "https://YOUR_AUTH0_DOMAIN/.well-known/openid-configuration"
# Google alternative: https://accounts.google.com/.well-known/openid-configuration
