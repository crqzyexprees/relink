[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0e161d"
secondaryBackgroundColor = "#1b2933"
textColor = "#e6edf3"
font = "sans serif"

[server]
# Persistent history belongs to this local workspace; bind locally by default.
address = "127.0.0.1"
maxUploadSize = 10
headless = true

[browser]
gatherUsageStats = false
