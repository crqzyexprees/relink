[theme]
base = "dark"
primaryColor = "#ffc17a"
backgroundColor = "#080f20"
secondaryBackgroundColor = "#121e32"
textColor = "#f2eee7"
font = "sans serif"

[server]
# Persistent history belongs to this local workspace; bind locally by default.
address = "127.0.0.1"
maxUploadSize = 10
headless = true

[browser]
gatherUsageStats = false
